

{% extends "layout.html" %}
{% block content %}
    <h1>Demo Catalog</h1>
    <div class="row">
    <div class="col mb-3">
        <label class="form-label">Tenant</label>
        <select class="form-control" id="tenant" required>
        <option value="">-- None --</option>
        </select>
        </div>
    <div class="col mb-3">
        <label class="form-label">Environment</label>
        <select class="form-control" id="env" required>
        <option value="">-- None --</option>
        </select>
    </div>
</div>
    <div class="row">
    <div class="col mb-3">
        <label class="form-label">Location</label>
        <select class="form-control" id="loc" required>
        <option value="">-- None --</option>
        </select>
        </div>
    <div class="col mb-3">
        <label class="form-label">Management Group</label>
        <select class="form-control" id="manage" required>
        <option value="">-- None --</option>
        </select>
    </div>
</div>
    <div class="row">
    <div class="col mb-3">
        <label class="form-label">Subscription Type</label>
        <select class="form-control" id="subtype" required>
        <option value="">-- None --</option>
        </select>
        </div>
    <div class="col mb-3">
        <label class="form-label">Application</label>
        <select class="form-control" id="app" required>
        <option value="">-- None --</option>
        </select>
    </div>
</div>
    <div class="row">
    <div class="col mb-3">
        <label class="form-label">Subscription</label>
        <input class="form-control" id="sub" readonly>
        </div>
    <div class="col mb-3">
        <label class="form-label">Resource Group</label>
        <input type="text" class="form-control" id="rg" readonly>
    </div>
</div>
    <div class="row">
    <div class="col mb-3">
        <label class="form-label">Vnet</label>
        <input class="form-control" id="vnet" readonly>
        </div>
    <div class="col mb-3">
        <label class="form-label">Subnet</label>
        <input type="text" class="form-control" id="subnet" readonly>
    </div>
</div>
   <script src="{{url_for('static',filename='catalog.js')}}"></script>
{% endblock content %}
