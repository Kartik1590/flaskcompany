
{% extends "layout.html" %}
{% block content %}
    
    
    <article class="media content-section">
      <img src="{{url_for('static',filename='pics/'+ post.author.image_file)}}" alt="" class="rounded-circle article-img">
        <div class="media-body">
          <div class="article-metadata">
            <a class="mr-2" href="#">{{ post.author.username }}</a>
            <small class="text-muted">{{ post.date_posted.strftime('%Y-%m-%d') }}</small>
            {% if post.author==current_user %}
            <a class="btn btn-secondary btn-sm m-1" href="{{url_for('update_post',post_id=post.id)}}">Update</a>
            <button type="button" class="btn btn-danger btn-sm m-1" onclick="location.assign(`{{url_for('delete_post',post_id=post.id)}}`)">Delete</button>
            {%endif%}
          </div>
          <h2>{{ post.title }}</h2>
          <p class="article-content">{{ post.content }}</p>
        </div>
      </article>
  
    

    {% endblock content %}
